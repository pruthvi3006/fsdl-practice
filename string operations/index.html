<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Operations</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>String Processor</h1>
    <div class="container">
    <input type="text" id="input" placeholder="Enter the String">
    <button onclick="process()">Process</button>

    <p>Reverse:<span id="rev"></span></p>
    <p>UpperCase:<span id="upper"></span></p>
    <p>LowerCase:<span id="lower"></span></p>
    <p>Length:<span id="len"></span></p>
    </div>
    <script src="script.js"></script>

</body>
</html>
