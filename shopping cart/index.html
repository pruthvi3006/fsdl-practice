<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>My Cart</h1>
    <div class="item">
        <p>Product A - $10</p>
        <button onclick="changeQty(-1)">-</button>
        <span id="qty">1</span>
        <button onclick="changeQty(1)">+</button>
    </div>
    <h3 id="total">Total: $<span id="totals">10</span></h3>
    <script src="script.js"></script>
</body>
</html>
